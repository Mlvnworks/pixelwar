<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flying Rocket Bomb</title>
    <style>
      :root {
        --bg-top: #0b1020;
        --bg-bottom: #1c2b4a;
        --rocket-body: #c0392b;
        --rocket-body-dark: #8e2a20;
        --rocket-nose: #2c3e50;
        --rocket-fin: #34495e;
        --rocket-window: #a9d6ff;
        --flame-outer: #ff9d00;
        --flame-inner: #fff3b0;
        --panel-bg: rgba(15, 20, 35, 0.72);
        --panel-border: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.92);
        --text-dim: rgba(255, 255, 255, 0.55);
        --accent: #ff9d00;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% -10%,
          var(--bg-bottom),
          var(--bg-top) 70%
        );
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
      }

      #topbar {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(8px);
        padding: 10px 12px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        z-index: 10;
      }
      #topbar label {
        color: var(--text-dim);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding-left: 4px;
        white-space: nowrap;
      }
      #targetInput {
        width: 210px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        font-size: 13px;
        outline: none;
      }
      #targetInput::placeholder {
        color: var(--text-dim);
      }
      #targetInput:focus {
        border-color: var(--accent);
      }
      #launchBtn {
        padding: 8px 16px;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: #251200;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          filter 0.15s,
          transform 0.1s;
      }
      #launchBtn:hover {
        filter: brightness(1.08);
      }
      #launchBtn:active {
        transform: scale(0.96);
      }
      #launchBtn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        filter: none;
      }

      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        color: var(--text-dim);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        pointer-events: none;
        line-height: 1.6;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        z-index: 5;
      }
      #status {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: var(--text);
        font-size: 13px;
        letter-spacing: 0.03em;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        padding: 8px 16px;
        border-radius: 999px;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        transition: opacity 0.2s;
      }
      #hint {
        position: fixed;
        bottom: 16px;
        right: 16px;
        color: var(--text-dim);
        font-size: 11px;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        text-align: right;
        max-width: 220px;
      }
      #flash {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="flash"></div>

    <div id="topbar">
      <label for="targetInput">Target</label>
      <input
        id="targetInput"
        type="text"
        placeholder="e.g. 500,300  or  60%,40%"
        autocomplete="off"
      />
      <button id="launchBtn">Launch</button>
    </div>

    <div id="hud">
      SPEED <span id="hud-speed">0</span> px/s<br />
      HEADING <span id="hud-heading">0</span>&deg;
    </div>

    <div id="status">STANDING BY — enter a target and launch</div>
    <div id="hint">
      click the sky to drop in coordinates &middot; type "x,y" or "%,%" &middot;
      press Enter to launch
    </div>

    <script>
      (function () {
        "use strict";

        const canvas = document.getElementById("scene");
        const ctx = canvas.getContext("2d");
        const hudSpeed = document.getElementById("hud-speed");
        const hudHeading = document.getElementById("hud-heading");
        const statusEl = document.getElementById("status");
        const inputEl = document.getElementById("targetInput");
        const launchBtn = document.getElementById("launchBtn");
        const flashEl = document.getElementById("flash");

        let W, H, DPR;
        function resize() {
          DPR = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth;
          H = window.innerHeight;
          canvas.width = W * DPR;
          canvas.height = H * DPR;
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        }
        window.addEventListener("resize", () => {
          resize();
          placeOnPad();
        });
        resize();

        // ---------- Starfield background ----------
        const stars = Array.from({ length: 140 }, () => ({
          x: Math.random(),
          y: Math.random(),
          r: Math.random() * 1.4 + 0.2,
          tw: Math.random() * Math.PI * 2,
        }));

        // ---------- Physics constants ----------
        const THRUST_ACCEL = 900; // px/s^2, acceleration along the straight launch line
        const MAX_SPEED = 560; // px/s, speed cap once cruising
        const ROCKET_LEN = 46;
        const HIT_RADIUS = 22; // how close counts as "reached the target"

        // ---------- State machine ----------
        // idle -> flying -> exploding -> done -> (idle-like, waiting for next launch)
        let state = "idle";
        let explodeTimer = 0;
        const EXPLODE_DURATION = 1.1;
        let shake = 0;

        const rocket = {
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          angle: -Math.PI / 2,
          target: { x: 0, y: 0 },
          dirX: 0,
          dirY: -1, // fixed unit direction for the current straight run
          speed: 0,
        };

        function placeOnPad() {
          rocket.x = W / 2;
          rocket.y = H - 60;
          rocket.vx = 0;
          rocket.vy = 0;
          rocket.angle = -Math.PI / 2; // pointing straight up
        }
        placeOnPad();

        function setStatus(text) {
          statusEl.textContent = text;
        }

        // ---------- Target parsing ----------
        function parseTarget(str) {
          if (!str) return null;
          const parts = str.split(",").map((s) => s.trim());
          if (parts.length !== 2) return null;
          let [a, b] = parts;
          let x, y;
          if (a.endsWith("%")) {
            x = (parseFloat(a) / 100) * W;
          } else {
            x = parseFloat(a);
          }
          if (b.endsWith("%")) {
            y = (parseFloat(b) / 100) * H;
          } else {
            y = parseFloat(b);
          }
          if (Number.isNaN(x) || Number.isNaN(y)) return null;
          const pad = 30;
          x = Math.max(pad, Math.min(W - pad, x));
          y = Math.max(pad, Math.min(H - pad, y));
          return { x, y };
        }

        function launch() {
          if (state === "flying" || state === "exploding") return;
          const t = parseTarget(inputEl.value);
          if (!t) {
            setStatus('Enter a target like "500,300" or "60%,40%"');
            inputEl.focus();
            return;
          }
          placeOnPad();
          rocket.target = t;

          // lock in a straight-line heading for the whole run — no steering, no drift
          const dx = t.x - rocket.x;
          const dy = t.y - rocket.y;
          const dist = Math.hypot(dx, dy) || 1;
          rocket.dirX = dx / dist;
          rocket.dirY = dy / dist;
          rocket.angle = Math.atan2(dy, dx);
          rocket.speed = 0;

          state = "flying";
          setStatus("EN ROUTE to target…");
          launchBtn.disabled = true;
        }

        launchBtn.addEventListener("click", launch);
        inputEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter") launch();
        });

        canvas.addEventListener("pointerdown", (e) => {
          if (state === "flying" || state === "exploding") return;
          inputEl.value = `${Math.round(e.clientX)},${Math.round(e.clientY)}`;
          inputEl.focus();
        });

        // ---------- Exhaust particles ----------
        const particles = [];
        function spawnExhaust() {
          const tailX = rocket.x - Math.cos(rocket.angle) * (ROCKET_LEN * 0.55);
          const tailY = rocket.y - Math.sin(rocket.angle) * (ROCKET_LEN * 0.55);
          for (let i = 0; i < 3; i++) {
            const spread = (Math.random() - 0.5) * 0.6;
            const backAngle = rocket.angle + Math.PI + spread;
            const speed = 60 + Math.random() * 90;
            particles.push({
              x: tailX,
              y: tailY,
              vx: Math.cos(backAngle) * speed + rocket.vx * 0.3,
              vy: Math.sin(backAngle) * speed + rocket.vy * 0.3,
              life: 0,
              maxLife: 0.35 + Math.random() * 0.25,
              size: 4 + Math.random() * 4,
              kind: "smoke",
            });
          }
          if (particles.length > 500)
            particles.splice(0, particles.length - 500);
        }

        function spawnExplosion(x, y) {
          const N = 90;
          for (let i = 0; i < N; i++) {
            const ang = Math.random() * Math.PI * 2;
            const speed = 90 + Math.random() * 420;
            particles.push({
              x,
              y,
              vx: Math.cos(ang) * speed,
              vy: Math.sin(ang) * speed,
              life: 0,
              maxLife: 0.5 + Math.random() * 0.7,
              size: 3 + Math.random() * 6,
              kind: "spark",
            });
          }
          // slower smoke puff
          for (let i = 0; i < 28; i++) {
            const ang = Math.random() * Math.PI * 2;
            const speed = 20 + Math.random() * 70;
            particles.push({
              x,
              y,
              vx: Math.cos(ang) * speed,
              vy: Math.sin(ang) * speed - 30,
              life: 0,
              maxLife: 0.9 + Math.random() * 0.6,
              size: 10 + Math.random() * 14,
              kind: "cloud",
            });
          }
        }

        function updateParticles(dt) {
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life += dt;
            if (p.life >= p.maxLife) {
              particles.splice(i, 1);
              continue;
            }
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            const drag = p.kind === "cloud" ? 1.2 : 1.5;
            p.vx *= 1 - drag * dt;
            p.vy *= 1 - drag * dt;
            if (p.kind === "spark") p.vy += 180 * dt; // gravity on debris
          }
        }

        function drawParticles() {
          for (const p of particles) {
            const t = p.life / p.maxLife;
            const alpha = 1 - t;
            const size =
              p.size * (p.kind === "cloud" ? 1 + t * 0.8 : 1 - t * 0.6);
            let inner, outer;
            if (p.kind === "spark") {
              inner = `255,244,214`;
              outer = `255,120,0`;
            } else if (p.kind === "cloud") {
              inner = `120,120,120`;
              outer = `40,40,40`;
            } else {
              inner = `255,244,214`;
              outer = `255,120,0`;
            }
            const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size);
            grad.addColorStop(0, `rgba(${inner},${alpha})`);
            grad.addColorStop(1, `rgba(${outer},0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // ---------- Physics update ----------
        function shortestAngleDiff(a, b) {
          let diff = (b - a) % (Math.PI * 2);
          if (diff > Math.PI) diff -= Math.PI * 2;
          if (diff < -Math.PI) diff += Math.PI * 2;
          return diff;
        }

        function updateFlying(dt) {
          // heading is locked at launch (rocket.dirX/dirY) — no steering, no gravity, no drag,
          // so the flight path is a straight line with no swirl or curve.
          const distRemaining = Math.hypot(
            rocket.target.x - rocket.x,
            rocket.target.y - rocket.y,
          );

          // simple thrust ramp-up, capped at MAX_SPEED, easing off in the last stretch so it
          // doesn't overshoot the target on a fast frame.
          rocket.speed = Math.min(rocket.speed + THRUST_ACCEL * dt, MAX_SPEED);
          const step = Math.min(rocket.speed * dt, distRemaining);

          rocket.x += rocket.dirX * step;
          rocket.y += rocket.dirY * step;
          rocket.vx = rocket.dirX * rocket.speed;
          rocket.vy = rocket.dirY * rocket.speed;

          spawnExhaust();

          const dist = Math.hypot(
            rocket.target.x - rocket.x,
            rocket.target.y - rocket.y,
          );
          if (dist < HIT_RADIUS) {
            state = "exploding";
            explodeTimer = 0;
            spawnExplosion(rocket.target.x, rocket.target.y);
            shake = 18;
            flashEl.style.transition = "none";
            flashEl.style.opacity = "0.85";
            requestAnimationFrame(() => {
              flashEl.style.transition = "opacity .5s ease-out";
              flashEl.style.opacity = "0";
            });
            setStatus("IMPACT!");
          }
        }

        function updateExploding(dt) {
          explodeTimer += dt;
          if (shake > 0) shake = Math.max(0, shake - dt * 40);
          if (explodeTimer >= EXPLODE_DURATION) {
            state = "done";
            launchBtn.disabled = false;
            setStatus("Target destroyed — enter a new target and launch again");
            placeOnPad();
          }
        }

        function update(dt) {
          if (state === "flying") updateFlying(dt);
          else if (state === "exploding") updateExploding(dt);
          updateParticles(dt);

          const speed = Math.hypot(rocket.vx, rocket.vy);
          let headingDeg = ((rocket.angle * 180) / Math.PI) % 360;
          if (headingDeg < 0) headingDeg += 360;
          hudSpeed.textContent = speed.toFixed(0);
          hudHeading.textContent = headingDeg.toFixed(0);
        }

        // ---------- Drawing ----------
        function drawBackground(t) {
          const grad = ctx.createLinearGradient(0, 0, 0, H);
          grad.addColorStop(0, "#0b1020");
          grad.addColorStop(1, "#1c2b4a");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);

          for (const s of stars) {
            const flicker = 0.5 + 0.5 * Math.sin(t * 2 + s.tw);
            ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.5 * flicker})`;
            ctx.beginPath();
            ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        function drawLaunchPad() {
          if (state !== "idle" && state !== "done") return;
          ctx.save();
          ctx.translate(rocket.x, rocket.y + ROCKET_LEN * 0.55);
          ctx.fillStyle = "rgba(255,255,255,0.12)";
          ctx.beginPath();
          ctx.ellipse(0, 0, 34, 8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(255,157,0,0.6)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(0, 0, 34, 8, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        function drawTargetMarker() {
          if (state !== "flying") return;
          const t = performance.now() / 300;
          const pulse = 10 + Math.sin(t) * 3;
          ctx.save();
          ctx.strokeStyle = "rgba(255,157,0,0.85)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(rocket.target.x, rocket.target.y, pulse, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(rocket.target.x - 16, rocket.target.y);
          ctx.lineTo(rocket.target.x + 16, rocket.target.y);
          ctx.moveTo(rocket.target.x, rocket.target.y - 16);
          ctx.lineTo(rocket.target.x, rocket.target.y + 16);
          ctx.stroke();
          ctx.restore();
        }

        function getCSS(varName) {
          return getComputedStyle(document.documentElement)
            .getPropertyValue(varName)
            .trim();
        }

        function roundedRocketPath(L, bodyW) {
          ctx.beginPath();
          ctx.moveTo(-L * 0.3, -bodyW * 0.5);
          ctx.lineTo(L * 0.2, -bodyW * 0.5);
          ctx.quadraticCurveTo(L * 0.34, -bodyW * 0.5, L * 0.32, -bodyW * 0.42);
          ctx.lineTo(L * 0.32, bodyW * 0.42);
          ctx.quadraticCurveTo(L * 0.34, bodyW * 0.5, L * 0.2, bodyW * 0.5);
          ctx.lineTo(-L * 0.3, bodyW * 0.5);
          ctx.quadraticCurveTo(-L * 0.42, bodyW * 0.5, -L * 0.42, 0);
          ctx.quadraticCurveTo(-L * 0.42, -bodyW * 0.5, -L * 0.3, -bodyW * 0.5);
          ctx.closePath();
        }

        function drawRocket() {
          if (state === "exploding" || state === "done") {
            if (state === "done") return; // rocket destroyed, nothing to draw until next launch
            if (state === "exploding") return; // consumed by the blast
          }
          ctx.save();
          ctx.translate(rocket.x, rocket.y);
          ctx.rotate(rocket.angle);

          const L = ROCKET_LEN;
          const bodyW = L * 0.3;

          ctx.save();
          ctx.translate(3, 5);
          ctx.globalAlpha = 0.25;
          ctx.fillStyle = "#000";
          roundedRocketPath(L, bodyW);
          ctx.fill();
          ctx.restore();

          ctx.fillStyle = getCSS("--rocket-fin");
          ctx.beginPath();
          ctx.moveTo(-L * 0.28, -bodyW * 0.5);
          ctx.lineTo(-L * 0.55, -bodyW * 1.6);
          ctx.lineTo(-L * 0.12, -bodyW * 0.5);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(-L * 0.28, bodyW * 0.5);
          ctx.lineTo(-L * 0.55, bodyW * 1.6);
          ctx.lineTo(-L * 0.12, bodyW * 0.5);
          ctx.closePath();
          ctx.fill();

          const bodyGrad = ctx.createLinearGradient(
            0,
            -bodyW / 2,
            0,
            bodyW / 2,
          );
          bodyGrad.addColorStop(0, "#e0574a");
          bodyGrad.addColorStop(0.5, getCSS("--rocket-body"));
          bodyGrad.addColorStop(1, getCSS("--rocket-body-dark"));
          ctx.fillStyle = bodyGrad;
          roundedRocketPath(L, bodyW);
          ctx.fill();
          ctx.strokeStyle = "rgba(0,0,0,0.35)";
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.fillStyle = getCSS("--rocket-nose");
          ctx.beginPath();
          ctx.moveTo(L * 0.32, -bodyW * 0.42);
          ctx.lineTo(L * 0.5, 0);
          ctx.lineTo(L * 0.32, bodyW * 0.42);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = getCSS("--rocket-window");
          ctx.beginPath();
          ctx.arc(-L * 0.02, 0, bodyW * 0.22, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(0,0,0,0.4)";
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.strokeStyle = "rgba(255,255,255,0.5)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-L * 0.3, -bodyW * 0.48);
          ctx.lineTo(L * 0.2, -bodyW * 0.48);
          ctx.stroke();

          if (state === "flying") {
            const flicker = 0.75 + Math.random() * 0.5;
            const flameLen = L * 0.55 * flicker;
            const flameGrad = ctx.createLinearGradient(
              -L * 0.28,
              0,
              -L * 0.28 - flameLen,
              0,
            );
            flameGrad.addColorStop(0, getCSS("--flame-inner"));
            flameGrad.addColorStop(0.4, getCSS("--flame-outer"));
            flameGrad.addColorStop(1, "rgba(255,80,0,0)");
            ctx.fillStyle = flameGrad;
            ctx.beginPath();
            ctx.moveTo(-L * 0.28, -bodyW * 0.32);
            ctx.quadraticCurveTo(
              -L * 0.28 - flameLen * 0.6,
              0,
              -L * 0.28 - flameLen,
              0,
            );
            ctx.quadraticCurveTo(
              -L * 0.28 - flameLen * 0.6,
              0,
              -L * 0.28,
              bodyW * 0.32,
            );
            ctx.closePath();
            ctx.fill();
          }

          ctx.restore();
        }

        function drawExplosionGlow() {
          if (state !== "exploding") return;
          const t = explodeTimer / EXPLODE_DURATION;
          const radius = 20 + t * 140;
          const alpha = Math.max(0, 1 - t * 1.3);
          const grad = ctx.createRadialGradient(
            rocket.target.x,
            rocket.target.y,
            0,
            rocket.target.x,
            rocket.target.y,
            radius,
          );
          grad.addColorStop(0, `rgba(255,244,214,${alpha})`);
          grad.addColorStop(0.35, `rgba(255,157,0,${alpha * 0.7})`);
          grad.addColorStop(1, `rgba(255,80,0,0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(rocket.target.x, rocket.target.y, radius, 0, Math.PI * 2);
          ctx.fill();

          // expanding shockwave ring
          ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(
            rocket.target.x,
            rocket.target.y,
            12 + t * 90,
            0,
            Math.PI * 2,
          );
          ctx.stroke();
        }

        // ---------- Main loop ----------
        let lastTime = null;
        function frame(now) {
          if (lastTime === null) lastTime = now;
          let dt = (now - lastTime) / 1000;
          dt = Math.min(dt, 1 / 30);
          lastTime = now;

          update(dt);

          ctx.save();
          if (shake > 0) {
            ctx.translate(
              (Math.random() - 0.5) * shake,
              (Math.random() - 0.5) * shake,
            );
          }
          ctx.clearRect(-20, -20, W + 40, H + 40);
          drawBackground(now / 1000);
          drawTargetMarker();
          drawParticles();
          drawExplosionGlow();
          drawLaunchPad();
          drawRocket();
          ctx.restore();

          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
